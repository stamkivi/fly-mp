<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kärbes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F4EF; --card:#FFFFFF; --ink:#1B1A18; --mute:#6E6A63; --rule:#E2DED5;
  --blind:#9A958C; --seen:#E2622C; --accent:#1B6B8C;
  --optic:#4FA8CC; --central:#DE5FA0; --cord:#5FB97F; --ascending:#8B7BD0; --descending:#EE9A3C;
  --display:"Fraunces",Georgia,serif;
  --body:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.5;
     -webkit-font-smoothing:antialiased}
.mono{font-family:var(--mono)}

/* ---------------- the stage: one screen, no scrolling needed ---------------- */
.stage{position:relative;height:100svh;min-height:600px;display:flex;flex-direction:column;
       padding:18px 22px 14px;gap:12px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:20px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:600;font-size:23px;letter-spacing:-.01em}
.brand span{font-family:var(--mono);font-size:10.5px;font-weight:400;letter-spacing:.1em;
            text-transform:uppercase;color:var(--mute);margin-left:10px}
.billline{font-size:13.5px;color:var(--mute);text-align:right;max-width:58ch}
.billline b{color:var(--ink);font-weight:600}

.board{flex:1;display:grid;grid-template-columns:1fr 340px;gap:14px;min-height:0}
@media(max-width:900px){.board{grid-template-columns:1fr;grid-template-rows:1fr 190px}}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:10px;
       position:relative;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.tag{position:absolute;left:14px;top:12px;font-family:var(--mono);font-size:10.5px;
     letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.tagr{position:absolute;right:14px;top:12px;font-family:var(--mono);font-size:10.5px;
      color:var(--mute)}

.regions{position:absolute;left:14px;bottom:12px;right:14px;display:flex;flex-wrap:wrap;
         gap:5px 12px;font-family:var(--mono);font-size:10.5px;color:var(--mute)}
.regions i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.regions b{color:var(--ink);font-weight:500}

.status{min-height:26px;font-family:var(--mono);font-size:12.5px;color:var(--mute);
        display:flex;align-items:center;gap:10px}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--seen);flex:none;opacity:0}
.status.live .dot{opacity:1;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}

/* ---------------- overlays ---------------- */
.veil{position:absolute;inset:0;display:grid;place-items:center;padding:24px;
      background:rgba(246,244,239,.93);backdrop-filter:blur(3px);transition:opacity .45s ease}
.veil.gone{opacity:0;pointer-events:none}
.launch{max-width:640px;text-align:center}
.launch h1{font-family:var(--display);font-weight:600;font-size:clamp(26px,4.4vw,40px);
           line-height:1.12;margin:0 0 10px}
.launch p{color:var(--mute);font-size:15px;margin:0 auto 6px;max-width:52ch}
.launch .bill{margin:18px auto 20px;padding:14px 16px;border:1px solid var(--rule);
              border-radius:8px;background:var(--card);max-width:56ch;text-align:left}
.launch .bill .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
                 text-transform:uppercase;color:var(--mute)}
.launch .bill h2{font-family:var(--display);font-weight:400;font-size:18px;line-height:1.3;
                 margin:6px 0 4px}
.launch .bill .m{font-family:var(--mono);font-size:11.5px;color:var(--mute)}
.ask{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
     color:var(--mute);margin-bottom:10px}
.ballot{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.ballot button{font-family:var(--body);font-size:15px;font-weight:600;color:var(--ink);
  background:var(--card);border:1px solid var(--rule);border-radius:7px;padding:12px 20px;
  min-height:46px;cursor:pointer;transition:border-color .15s,transform .1s,box-shadow .15s}
.ballot button:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.ballot button:active{transform:translateY(1px)}
.ballot button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ballot small{display:block;font-weight:400;font-size:11px;color:var(--mute);
              font-family:var(--mono);margin-top:1px}
.whatis{margin-top:18px;background:none;border:0;border-bottom:1px dotted var(--mute);
        font-family:var(--mono);font-size:11.5px;color:var(--mute);cursor:pointer;padding:2px 0}
.whatis:hover{color:var(--ink);border-color:var(--ink)}
.whatis-body{margin:12px auto 0;max-width:54ch;font-size:13.5px;color:var(--mute);text-align:left}

/* pot tooltip */
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--rule);
     border-radius:7px;padding:9px 11px;max-width:270px;box-shadow:0 4px 18px rgba(0,0,0,.09);
     font-size:12.5px;line-height:1.4;opacity:0;transition:opacity .12s;z-index:5}
.tip.on{opacity:1}
.tip b{display:block;font-size:12.5px;margin-bottom:3px}
.tip .q{color:var(--mute);font-family:var(--body)}
.tip .n{font-family:var(--mono);font-size:11px;color:var(--mute);margin-top:5px}

/* ---------------- outcome ---------------- */
/* The outcome sits under the arena rather than over it: the trails are the result, and
   covering them with a sheet the moment the fly stopped meant you never got to read it. */
.result{display:grid;grid-template-columns:minmax(200px,1fr) 2.4fr auto;gap:14px;
        align-items:center;background:var(--card);border:1px solid var(--rule);
        border-radius:10px;padding:12px 14px;animation:rise .4s cubic-bezier(.2,.7,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(max-width:900px){.result{grid-template-columns:1fr}}
.result-head h2{font-family:var(--display);font-weight:600;font-size:17px;margin:0;line-height:1.2}
.result-head .sub{color:var(--mute);font-size:12.5px;margin:3px 0 0}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:620px){.cards{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:7px;padding:9px 10px}
.card.hi{border-color:var(--seen);box-shadow:0 0 0 2px rgba(226,98,44,.12)}
.card .k{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
         color:var(--mute)}
.card .v{font-family:var(--display);font-size:17px;margin-top:3px;line-height:1.15}
.card .n{font-family:var(--mono);font-size:10.5px;color:var(--mute);margin-top:6px;line-height:1.45}
.again{font-family:var(--mono);font-size:12px;white-space:nowrap;
       background:none;border:1px solid var(--rule);border-radius:6px;padding:9px 16px;
       color:var(--ink);cursor:pointer}
.again:hover{border-color:var(--accent)}

/* ---------------- the notes, deliberately below the fold ---------------- */
.notes{max-width:760px;margin:0 auto;padding:64px 22px 90px}
.notes h3{font-family:var(--display);font-weight:600;font-size:20px;margin:36px 0 10px}
.notes p{color:var(--mute);font-size:14.5px;max-width:68ch}
.notes b{color:var(--ink)}
.scrollcue{text-align:center;font-family:var(--mono);font-size:11px;color:var(--mute);
           letter-spacing:.08em;text-transform:uppercase}
table.facts{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px;
            margin-top:8px}
table.facts td{padding:7px 0;border-bottom:1px solid var(--rule);vertical-align:top}
table.facts td:first-child{color:var(--mute);width:38%;padding-right:16px}
@media(prefers-reduced-motion:reduce){.status.live .dot{animation:none;opacity:1}}
</style>
</head>
<body>

<main class="stage">
  <div class="top">
    <div class="brand">Kärbes<span>a fly brain in the Riigikogu</span></div>
    <div class="billline" id="billline"></div>
  </div>

  <div class="board">
    <div class="panel">
      <canvas id="arena" role="img" aria-label="The arena."></canvas>
      <div class="tag">what this bill changes</div>
      <div class="tagr" id="clock"></div>
    </div>
    <div class="panel">
      <canvas id="brain" role="img" aria-label="The fly brain."></canvas>
      <div class="tag">166,700 neurons, firing</div>
      <div class="regions" id="regions"></div>
    </div>
  </div>

  <div class="status" id="status"><span class="dot"></span><span id="status-text"></span></div>

  <div class="veil" id="veil-launch">
    <div class="launch">
      <div class="bill">
        <div class="k" id="bill-kicker"></div>
        <h2 id="bill-title"></h2>
        <div class="m" id="bill-meta"></div>
      </div>
      <div class="ask">How would you vote?</div>
      <div class="ballot" role="group" aria-label="Your vote">
        <button data-vote="POOLT">Poolt<small>in favour</small></button>
        <button data-vote="VASTU">Vastu<small>against</small></button>
        <button data-vote="EI_HAALETANUD">Ei hääletanud<small>decline</small></button>
      </div>
      <button class="whatis" id="whatis" aria-expanded="false">then a fly votes · what is this?</button>
      <p class="whatis-body" id="whatis-body" hidden></p>
    </div>
  </div>

  <div class="result" id="result" hidden>
    <div class="result-head">
      <h2 id="outcome-title"></h2>
      <p class="sub" id="outcome-sub"></p>
    </div>
    <div class="cards">
        <div class="card" id="card-you"><div class="k">You</div>
          <div class="v" id="you-v">—</div><div class="n" id="you-n"></div></div>
        <div class="card" id="card-blind"><div class="k">On the bill alone</div>
          <div class="v" id="blind-v">—</div><div class="n" id="blind-n"></div></div>
        <div class="card hi" id="card-fly"><div class="k">Knowing who tabled it</div>
          <div class="v" id="fly-v">—</div><div class="n" id="fly-n"></div></div>
        <div class="card" id="card-cham"><div class="k">The Riigikogu</div>
          <div class="v" id="cham-v">—</div><div class="n" id="cham-n"></div></div>
      </div>
    <button class="again" id="again">Send it in again</button>
  </div>
</main>

<section class="notes">
  <div class="scrollcue">how this works</div>
  <h3>What you just watched</h3>
  <p id="note-what"></p>
  <h3>The part that decides it</h3>
  <p id="note-bit"></p>
  <h3>Honest caveats</h3>
  <p id="note-caveats"></p>
  <h3>Under the hood</h3>
  <table class="facts" id="facts"></table>
</section>

<script id="bundle" type="application/json">__BUNDLE_JSON__</script>
<script id="atlas-b64" type="text/plain">__ATLAS_B64__</script>
<script id="raster-b64" type="text/plain">__RASTER_B64__</script>
<script>
"use strict";
const B = JSON.parse(document.getElementById("bundle").textContent);
const A = B.arena;
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const ET = {POOLT:"Poolt", VASTU:"Vastu", EI_HAALETANUD:"Ei hääletanud"};

function b64(id){
  const bin = atob(document.getElementById(id).textContent.trim());
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

/* ---------- atlas: uint16 xyz, then one uint8 group per soma ---------- */
const K = B.atlas.somas;
const AR = b64("atlas-b64");
const XYZ = new Uint16Array(AR.buffer, AR.byteOffset, K * 3);
const GRP = new Uint8Array(AR.buffer, AR.byteOffset + K * 6, K);
const GROUPS = B.atlas.groups;
const GHZ = B.atlas.group_hz;

/* ---------- raster: u32 frames | u32 offsets | u16 slots ---------- */
const RR = b64("raster-b64");
const RV = new DataView(RR.buffer, RR.byteOffset);
const FRAMES = RV.getUint32(4, true);
const OFF = new Uint32Array(RR.buffer, RR.byteOffset + 8, FRAMES + 1);
const SLOTS = new Uint16Array(RR.buffer, RR.byteOffset + 8 + 4 * (FRAMES + 1));
const frameSlots = f => SLOTS.subarray(OFF[f], OFF[f + 1]);

/* ================= the brain ================= */
/* A fixed dorsal view — x across, z along the body — so the picture matches how this
   connectome is usually shown: two optic lobes and the central brain at one end, the nerve
   cord trailing away. It does not rotate, which is what lets each region be pre-rendered
   once as a soft density field and then simply brightened as it fires. Drawing 16,000
   individual dots per frame was both slower and much harder to read. */
const REGION_COLOUR = {optic:[79,168,204], central:[222,95,160], cord:[95,185,127],
                       ascending:[139,123,208], descending:[238,154,60]};
const brain = document.getElementById("brain");
const bctx = brain.getContext("2d");
let BW = 0, BH = 0, layers = null, PX = null, PY = null;

function projectBrain(){
  let minX=1e9,maxX=-1e9,minZ=1e9,maxZ=-1e9;
  for (let i = 0; i < K; i++){
    const x = XYZ[i*3], z = XYZ[i*3+2];
    if(x<minX)minX=x; if(x>maxX)maxX=x; if(z<minZ)minZ=z; if(z>maxZ)maxZ=z;
  }
  const pad = 16;
  const sx = (BW - pad*2) / (maxX - minX), sz = (BH - pad*2) / (maxZ - minZ);
  const k = Math.min(sx, sz);
  const ox = (BW - (maxX-minX)*k)/2, oz = (BH - (maxZ-minZ)*k)/2;
  PX = new Float32Array(K); PY = new Float32Array(K);
  for (let i = 0; i < K; i++){
    PX[i] = ox + (XYZ[i*3] - minX) * k;
    PY[i] = oz + (XYZ[i*3+2] - minZ) * k;
  }
}

function buildLayers(){
  projectBrain();
  layers = GROUPS.map((name, gid) => {
    const c = document.createElement("canvas");
    c.width = BW; c.height = BH;
    const g = c.getContext("2d");
    const [r, gg, b] = REGION_COLOUR[name] || [120,120,120];
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const rad = 7 * dpr;
    g.globalCompositeOperation = "lighter";
    for (let i = 0; i < K; i++){
      if (GRP[i] !== gid) continue;
      const grad = g.createRadialGradient(PX[i], PY[i], 0, PX[i], PY[i], rad);
      grad.addColorStop(0, `rgba(${r},${gg},${b},.26)`);
      grad.addColorStop(1, `rgba(${r},${gg},${b},0)`);
      g.fillStyle = grad;
      g.fillRect(PX[i]-rad, PY[i]-rad, rad*2, rad*2);
    }
    return c;
  });
}

function sizeBrain(){
  const r = brain.getBoundingClientRect();
  const dpr = Math.min(devicePixelRatio || 1, 2);
  BW = Math.max(240, Math.round(r.width * dpr));
  BH = Math.max(160, Math.round(r.height * dpr));
  brain.width = BW; brain.height = BH;
  buildLayers();
}

const heat = new Float32Array(K);
function drawBrain(frame){
  if (!layers) sizeBrain();
  bctx.clearRect(0, 0, BW, BH);
  bctx.fillStyle = "#FFFFFF"; bctx.fillRect(0, 0, BW, BH);

  // Regions: always visible as faint anatomy, brightened by how hard each is firing.
  const peak = Math.max(6, ...GROUPS.map(g => Math.max(...(GHZ[g] || [0]))));
  bctx.globalCompositeOperation = "multiply";
  GROUPS.forEach((name, gid) => {
    const series = GHZ[name];
    const hz = (series && frame >= 0 && frame < series.length) ? series[frame] : 0;
    bctx.globalAlpha = 0.30 + 0.70 * Math.min(1, hz / peak);
    bctx.drawImage(layers[gid], 0, 0);
  });
  bctx.globalAlpha = 1;
  bctx.globalCompositeOperation = "source-over";

  // Individual spikes, as dark pinpricks so they read on paper.
  const dpr = Math.min(devicePixelRatio || 1, 2);
  for (let i = 0; i < K; i++){
    const h = heat[i];
    if (h < 0.05) continue;
    bctx.fillStyle = `rgba(27,26,24,${0.55 * h})`;
    bctx.fillRect(PX[i] - dpr*0.6, PY[i] - dpr*0.6, dpr*1.5, dpr*1.5);
  }
}

/* ================= the arena ================= */
const POTS = Object.keys(A.pots);
const LABELS = A.labels || {};
const arena = document.getElementById("arena");
const actx = arena.getContext("2d");
let AW = 0, AH = 0;
function sizeArena(){
  const r = arena.getBoundingClientRect();
  const dpr = Math.min(devicePixelRatio || 1, 2);
  AW = Math.max(320, Math.round(r.width * dpr));
  AH = Math.max(280, Math.round(r.height * dpr));
  arena.width = AW; arena.height = AH;
}
function arenaScale(){
  let far = A.ring * 1.12;
  for (const arm of ["blind", "seeing"])
    for (const p of A[arm].path) far = Math.max(far, Math.hypot(p[0], p[1]) * 1.06);
  return Math.min(AW, AH) / (2 * far * 1.16);
}

/* Drosophila from above.
   The proportions that make it read as this animal rather than a beetle: the wings are
   longer than the whole body and overhang well past the abdomen, held in a shallow V; the
   body is compact and dark, with the abdomen tapering to a point; the head is small and
   the eyes are a dark red rim, not headlights. An earlier version had a fat orange body,
   stubby wings and two big eyes, and read as a ladybird. */
function drawFly(cx, cy, heading, accent, scale, alpha){
  const S = scale;
  actx.save();
  actx.globalAlpha = alpha === undefined ? 1 : alpha;
  actx.translate(cx, cy); actx.rotate(-heading);

  // wings first, behind the body: long, translucent, swept back past the abdomen
  for (const sign of [-1, 1]){
    actx.save();
    actx.translate(-0.2*S, sign * 0.55*S);
    actx.rotate(sign * 0.46);
    const wg = actx.createLinearGradient(0, 0, -7.4*S, 0);
    wg.addColorStop(0,   "rgba(196,208,219,.80)");
    wg.addColorStop(.55, "rgba(202,213,223,.52)");
    wg.addColorStop(1,   "rgba(210,220,229,.16)");
    actx.fillStyle = wg;
    actx.beginPath();
    actx.ellipse(-3.8*S, sign*1.35*S, 4.1*S, 1.28*S, sign*0.05, 0, 7);
    actx.fill();
    actx.strokeStyle = "rgba(150,164,178,.42)";
    actx.lineWidth = Math.max(.35, .07*S);
    for (const v of [0.55, 1.35, 2.1]){
      actx.beginPath();
      actx.moveTo(-0.4*S, sign*0.7*S); actx.lineTo(-7.2*S, sign*v*S); actx.stroke();
    }
    actx.restore();
  }

  // legs: thin, splayed forward and back
  actx.strokeStyle = "rgba(34,30,27,.78)";
  actx.lineWidth = Math.max(.4, .085*S); actx.lineCap = "round";
  for (const sign of [-1, 1]){
    for (const [hx, kx, ky, tx, ty] of [[0.9, 1.45, 1.15, 2.0, 1.75],
                                        [0.25, 0.25, 1.35, -0.25, 1.95],
                                        [-0.35, -1.25, 1.3, -2.15, 1.7]]){
      actx.beginPath();
      actx.moveTo(hx*S, sign*0.55*S);
      actx.lineTo(kx*S, sign*ky*S);
      actx.lineTo(tx*S, sign*ty*S);
      actx.stroke();
    }
  }

  // abdomen: tapered, banded, dark with a warm cast
  const ab = actx.createLinearGradient(-4.6*S, 0, -0.8*S, 0);
  ab.addColorStop(0, "#241F1C"); ab.addColorStop(1, "#4A3A2E");
  actx.fillStyle = ab;
  actx.beginPath();
  actx.moveTo(-0.9*S, -1.15*S);
  actx.quadraticCurveTo(-4.9*S, -0.95*S, -5.0*S, 0);
  actx.quadraticCurveTo(-4.9*S, 0.95*S, -0.9*S, 1.15*S);
  actx.closePath(); actx.fill();
  actx.strokeStyle = "rgba(0,0,0,.35)"; actx.lineWidth = Math.max(.4, .12*S);
  for (const bx of [-1.9, -2.8, -3.7]){
    actx.beginPath();
    actx.moveTo(bx*S, -0.95*S); actx.lineTo(bx*S, 0.95*S); actx.stroke();
  }

  // thorax
  actx.fillStyle = "#2B2623";
  actx.beginPath(); actx.ellipse(0.25*S, 0, 1.5*S, 1.2*S, 0, 0, 7); actx.fill();
  actx.fillStyle = "rgba(255,255,255,.07)";
  actx.beginPath(); actx.ellipse(0.1*S, -0.35*S, 0.95*S, 0.4*S, -0.22, 0, 7); actx.fill();

  // head, with the eyes as a dark red rim rather than two lamps
  actx.fillStyle = "#231E1B";
  actx.beginPath(); actx.arc(1.75*S, 0, 0.95*S, 0, 7); actx.fill();
  actx.fillStyle = "#7E2B1C";
  for (const sign of [-1, 1]){
    actx.beginPath();
    actx.ellipse(1.8*S, sign*0.52*S, 0.62*S, 0.44*S, sign*0.4, 0, 7);
    actx.fill();
  }

  actx.restore();

  // a soft tinted shadow under the body tells the two flies apart without painting either
  actx.save();
  actx.globalCompositeOperation = "destination-over";
  actx.globalAlpha = (alpha === undefined ? 1 : alpha) * 0.42;
  const sh = actx.createRadialGradient(cx, cy, 0, cx, cy, 4.2*S);
  sh.addColorStop(0, accent);
  sh.addColorStop(1, accent.replace(")", ", 0)").replace("#", "rgba(") === accent
                     ? "rgba(255,255,255,0)" : "rgba(255,255,255,0)");
  actx.fillStyle = sh;
  actx.beginPath(); actx.ellipse(cx, cy, 4.2*S, 3.0*S, 0, 0, 7); actx.fill();
  actx.restore();
}

/* Position and heading between two steps, so the fly glides instead of snapping. */
function at(arm, step, sub){
  const path = A[arm].path, head = A[arm].heading;
  const i = Math.max(0, Math.min(step, path.length - 1));
  const j = Math.min(i + 1, path.length - 1);
  const t = i === j ? 0 : Math.max(0, Math.min(1, sub));
  let dh = head[j] - head[i];
  while (dh > Math.PI) dh -= 2*Math.PI;
  while (dh < -Math.PI) dh += 2*Math.PI;
  return [path[i][0] + (path[j][0] - path[i][0]) * t,
          path[i][1] + (path[j][1] - path[i][1]) * t,
          head[i] + dh * t];
}

let clockMs = 0;
function drawArena(step, sub){
  if (!AW) sizeArena();
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const k = arenaScale(), ox = AW/2, oy = AH/2;
  const X = v => ox + v*k, Y = v => oy - v*k;
  actx.clearRect(0,0,AW,AH);

  const nSeen = A.seeing.steps, nBlind = A.blind.steps;
  const shown = Math.max(0, Math.min(step, nSeen - 1));
  const revealed = shown >= A.reveal_step;
  const maxPot = Math.max(...POTS.map(n => A.pots[n]));

  actx.strokeStyle = "#EFEBE2"; actx.lineWidth = 1*dpr;
  actx.beginPath(); actx.arc(ox, oy, A.ring*k, 0, 7); actx.stroke();

  for (const name of POTS){
    const bear = A.bearings[name];
    const px = X(A.ring*Math.cos(bear)), py = Y(A.ring*Math.sin(bear));
    const s = A.pots[name] / maxPot;
    const r = (7 + 20*s) * dpr;
    // A haze, then rings drifting out of it: the pots have to look like they are giving
    // something off, or the fly appears to be walking between abstract markers.
    const grad = actx.createRadialGradient(px, py, 0, px, py, r*2.3);
    grad.addColorStop(0, `rgba(27,107,140,${0.09 + 0.24*s})`);
    grad.addColorStop(1, "rgba(27,107,140,0)");
    actx.fillStyle = grad;
    actx.beginPath(); actx.arc(px, py, r*2.3, 0, 7); actx.fill();
    const phase = (clockMs / 2600 + A.bearings[name] * 0.22) % 1;
    for (let ring = 0; ring < 3; ring++){
      const t = (phase + ring / 3) % 1;
      actx.strokeStyle = `rgba(27,107,140,${(0.30 + 0.34*s) * (1 - t) * (0.35 + 0.65*s)})`;
      actx.lineWidth = Math.max(1, 1.1*dpr*(1 - t*0.5));
      actx.beginPath(); actx.arc(px, py, r*(0.5 + 1.9*t), 0, 7); actx.stroke();
    }
    actx.fillStyle = `rgba(27,107,140,${0.34 + 0.52*s})`;
    actx.beginPath(); actx.arc(px, py, r*0.34, 0, 7); actx.fill();

    const done = shown >= nSeen - 1;
    const chosen = done && A.seeing.settled_on === name;
    actx.fillStyle = chosen ? "#E2622C" : "#6E6A63";
    actx.font = `${(chosen ? 600 : 400)} ${12.5*dpr}px "IBM Plex Sans",sans-serif`;
    actx.textAlign = Math.cos(bear) > 0.25 ? "left" : Math.cos(bear) < -0.25 ? "right" : "center";
    actx.textBaseline = Math.sin(bear) < -0.5 ? "top" : Math.sin(bear) > 0.5 ? "bottom" : "middle";
    const off = r + 11*dpr;
    actx.fillText(LABELS[name] || name,
      px + Math.cos(bear)*off*(actx.textAlign === "center" ? 0 : 1),
      py - Math.sin(bear)*off*(actx.textBaseline === "middle" ? 0 : 1));
  }
  actx.textAlign = "left"; actx.textBaseline = "alphabetic";

  const trail = (arm, colour, dash, upto) => {
    const path = A[arm].path;
    const last = Math.min(upto, path.length - 1);
    if (last < 1) return;
    actx.setLineDash(dash); actx.strokeStyle = colour;
    actx.lineWidth = 2.2*dpr; actx.lineJoin = "round"; actx.lineCap = "round";
    actx.beginPath();
    for (let i = 0; i <= last; i++){
      const px = X(path[i][0]), py = Y(path[i][1]);
      i ? actx.lineTo(px, py) : actx.moveTo(px, py);
    }
    // the partial segment the fly is currently walking, so the trail grows continuously
    const tip = at(arm, last, sub);
    actx.lineTo(X(tip[0]), Y(tip[1]));
    actx.stroke(); actx.setLineDash([]);
  };
  if (revealed) trail("blind", "#C4BFB5", [5*dpr, 5*dpr], Math.min(shown, nBlind - 1));
  trail("seeing", revealed ? "#E2622C" : "#1B6B8C", [], shown);

  /* The procedural signal is not a place. It is one-sided optic flow — a force on the
     turn, not a thing to walk toward — so it is drawn as a shadow sweeping the arena from
     the side the flow comes from. Marking it as a point on the ring made readers assume
     the fly was heading for it. */
  const sinceReveal = (step + sub) - A.reveal_step;
  if (sinceReveal >= 0 && sinceReveal < A.reveal_steps + 1.2){
    const t = Math.min(1, sinceReveal / (A.reveal_steps + 1.2));
    const fromRight = (B.vision.flow || 1) > 0;
    const edge = fromRight ? AW * (1 - t * 1.9) : AW * (t * 1.9 - 0.9);
    const sg = actx.createLinearGradient(edge, 0, edge + (fromRight ? AW*0.55 : -AW*0.55), 0);
    sg.addColorStop(0, `rgba(226,98,44,${0.16 * (1 - t)})`);
    sg.addColorStop(1, "rgba(226,98,44,0)");
    actx.fillStyle = sg;
    actx.fillRect(0, 0, AW, AH);
  }
  if (revealed){
    const rp = A.seeing.path[A.reveal_step];
    if (rp){
      actx.strokeStyle = "rgba(226,98,44,.30)"; actx.lineWidth = 1.2*dpr;
      actx.setLineDash([3*dpr, 3*dpr]);
      actx.beginPath(); actx.arc(X(rp[0]), Y(rp[1]), 10*dpr, 0, 7); actx.stroke();
      actx.setLineDash([]);
      // below the mark, so it cannot collide with the endpoint labels drawn later
      actx.fillStyle = "rgba(226,98,44,.7)";
      actx.font = `500 ${10.5*dpr}px "IBM Plex Mono",monospace`;
      actx.textAlign = "center";
      actx.fillText("knocked off course", X(rp[0]), Y(rp[1]) + 40*dpr);
      actx.textAlign = "left";
    }
    const bp = at("blind", Math.min(shown, nBlind - 1), sub);
    drawFly(X(bp[0]), Y(bp[1]), bp[2], "#9A958C", 3.2*dpr, .55);
  }
  const sp = at("seeing", shown, sub);
  drawFly(X(sp[0]), Y(sp[1]), sp[2], revealed ? "#E2622C" : "#2E6E8E", 3.9*dpr);

  // once both have stopped, name them where they stand rather than in a legend elsewhere
  if (shown >= nSeen - 1){
    actx.font = `500 ${11.5*dpr}px "IBM Plex Mono",monospace`;
    const mark = (pt, text, colour, nudge) => {
      actx.fillStyle = colour;
      const px = X(pt[0]), py = Y(pt[1]);
      actx.textAlign = px > AW*0.62 ? "right" : "left";
      actx.fillText(text, px + (actx.textAlign === "right" ? -14*dpr : 14*dpr),
                    py - 13*dpr + (nudge || 0) * 15*dpr);
      actx.textAlign = "left";
    };
    const bEnd = A.blind.path[nBlind-1], sEnd = A.seeing.path[nSeen-1];
    const close = Math.hypot(bEnd[0]-sEnd[0], bEnd[1]-sEnd[1]) * k < 46*dpr;
    mark(bEnd, "on the bill alone", "#9A958C", close ? -1 : 0);
    mark(sEnd, "knowing who tabled it", "#E2622C", close ? 1 : 0);
  }
}

/* ================= narration ================= */
const statusEl = document.getElementById("status");
const statusText = document.getElementById("status-text");
function say(text, live){
  statusText.textContent = text;
  statusEl.classList.toggle("live", !!live);
}

/* ================= static copy ================= */
const bill = B.bill, cham = B.chamber;
document.getElementById("billline").innerHTML =
  `<b>${bill.mark ? bill.mark + " SE" : "Bill"}</b> · ${cham.kind}`
  + (cham.when ? ` · ${cham.when.slice(0,10)}` : "");
document.getElementById("bill-kicker").textContent =
  [bill.mark ? bill.mark + " SE" : null, cham.kind].filter(Boolean).join(" · ");
document.getElementById("bill-title").textContent = bill.title;
document.getElementById("bill-meta").textContent =
  [bill.committee, cham.when ? cham.when.slice(0,10) : null].filter(Boolean).join("  ·  ");
{
  const body = document.getElementById("whatis-body");
  const btn = document.getElementById("whatis");
  body.textContent =
    "The eight questions this bill raises are laid out as eight smells around a ring, each as "
    + "strong as that question applies. A simulated fly brain — a real connectome, 166,700 "
    + "neurons — walks the fly toward whichever pulls hardest. Where it ends up is its vote. "
    + "Partway through it is told one more thing, through a second sense: who tabled the bill.";
  btn.onclick = () => {
    const open = body.hasAttribute("hidden");
    body.toggleAttribute("hidden", !open);
    btn.setAttribute("aria-expanded", String(open));
    btn.textContent = open ? "hide" : "then a fly votes · what is this?";
  };
}
document.getElementById("regions").innerHTML = GROUPS.map(g => {
  const c = REGION_COLOUR[g] || [120,120,120];
  return `<span><i style="background:rgb(${c[0]},${c[1]},${c[2]})"></i>${g} <b class="hz" data-g="${g}">0</b> Hz</span>`;
}).join("");
const hzEls = {};
document.querySelectorAll(".hz").forEach(e => hzEls[e.dataset.g] = e);

document.getElementById("cham-v").textContent = cham.advances_bill ? "Advanced" : "Rejected";
document.getElementById("cham-n").textContent =
  `${cham.in_favor} poolt · ${cham.against} vastu`
  + (cham.inverted ? " · on a motion to reject, so the polarity flips" : "");

document.getElementById("note-what").innerHTML = __NOTE_WHAT__;
document.getElementById("note-bit").innerHTML = __NOTE_BIT__;
document.getElementById("note-caveats").innerHTML = __CAVEATS__;
document.getElementById("facts").innerHTML = [
  ["Brain", `MaleCNS v1.0 · ${B.sim.neurons.toLocaleString()} neurons · ${B.sim.edges.toLocaleString()} connections`],
  ["Engine", B.sim.engine],
  ["Drawn", `${K.toLocaleString()} cell bodies at their measured 3-D coordinates`],
  ["Smell", `${B.drive.orn_left} left and ${B.drive.orn_right} right receptor neurons`],
  ["Sight", `${B.audit.t4t5_cells.toLocaleString()} motion detectors; ${B.audit.looming_cells} looming cells can make it bolt`],
  ["Steering", "the DNa descending family — 16 cells a side"],
  ["Walk", `${A.seeing.steps} steps of ${(A.step_seconds*1000).toFixed(0)} ms, the initiator revealed at step ${A.reveal_step + 1}`],
  ["Spikes", `${B.sim.total_spikes.toLocaleString()} · mean ${B.sim.mean_rate_hz.toFixed(1)} Hz`],
].map(([k,v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("");

/* ================= playback ================= */
const STEP_MS = REDUCED ? 120 : 420;
const veilLaunch = document.getElementById("veil-launch");
const resultEl = document.getElementById("result");
let yourVote = null, started = 0, running = false, raf = 0;

document.querySelectorAll(".ballot button").forEach(b => {
  b.onclick = () => { yourVote = b.dataset.vote; launch(); };
});
document.getElementById("again").onclick = launch;

function launch(){
  cancelAnimationFrame(raf);
  veilLaunch.classList.add("gone");
  resultEl.hidden = true;
  heat.fill(0);
  running = true; started = performance.now();
  say("the fly is in the arena, smelling the bill", true);
  raf = requestAnimationFrame(tick);
}

let lastFrame = -1, lastNow = 0;
function tick(now){
  const elapsed = now - started;
  const step = Math.floor(elapsed / STEP_MS);
  const sub = (elapsed % STEP_MS) / STEP_MS;
  const total = A.seeing.steps;

  const frame = Math.min(FRAMES - 1,
    Math.floor(step * A.frames_per_step + sub * A.frames_per_step));
  if (frame !== lastFrame && frame >= 0){
    for (const s of frameSlots(frame)) heat[s] = 1;
    lastFrame = frame;
    for (const g of GROUPS){
      const v = (GHZ[g] && GHZ[g][frame]) || 0;
      if (hzEls[g]) hzEls[g].textContent = v.toFixed(0);
    }
  }
  const decay = Math.exp(-(now - lastNow) / (STEP_MS * 0.9));
  for (let i = 0; i < K; i++) if (heat[i] > 0) heat[i] *= decay;
  lastNow = now;

  clockMs = elapsed;
  drawArena(step, sub);
  drawBrain(frame);
  document.getElementById("clock").textContent =
    `${Math.min(step + 1, total)} / ${total} · ${(Math.min(step+1,total) * A.step_seconds).toFixed(1)} s`;

  if (step === A.reveal_step) say("the government tabled this bill — and that lands as a force, not a fact", true);
  else if (step > A.reveal_step && step <= A.reveal_step + A.reveal_steps) say("it is being pushed off course", true);
  else if (step > A.reveal_step) say("it is settling somewhere else", true);

  describe(step);

  if (step >= total){ running = false; finish(); return; }
  raf = requestAnimationFrame(tick);
}

function finish(){
  const v = B.verdict;
  const where = arm => A[arm].escaped ? "bolted" : (LABELS[A[arm].settled_on] || A[arm].settled_on);
  document.getElementById("you-v").textContent = yourVote ? ET[yourVote] : "—";
  document.getElementById("you-n").textContent = "cast before the fly's";
  document.getElementById("blind-v").textContent = ET[v.blind];
  document.getElementById("blind-n").textContent = `went to “${where("blind")}”`;
  document.getElementById("fly-v").textContent = ET[v.seeing];
  document.getElementById("fly-n").textContent = `went to “${where("seeing")}”`;
  document.getElementById("outcome-title").textContent = v.flipped
    ? "Knowing who tabled it changed its vote"
    : `The fly voted ${ET[v.seeing]}`;
  const same = A.blind.settled_on === A.seeing.settled_on;
  document.getElementById("outcome-sub").textContent = v.flipped
    ? "Same brain, same bill, same seed. The only difference is one bit of procedure."
    : same
      ? "The procedural signal pushed it off course and it came back to the same question."
      : "It ended on a different question, but that did not change which way it voted.";
  say(v.flipped ? "the initiator changed its mind" : "it has decided", false);
  resultEl.hidden = false;
}

function describe(step){
  const s = Math.max(0, Math.min(step, A.seeing.steps - 1));
  arena.setAttribute("aria-label",
    `A fly walking among eight scents in a ring, one per question the bill raises. `
    + `At step ${s + 1} of ${A.seeing.steps} it is nearest “`
    + `${LABELS[A.seeing.nearest[s]] || A.seeing.nearest[s]}”. `
    + (s >= A.reveal_step ? "It has been shown who tabled the bill."
                          : "It has not yet been shown who tabled the bill."));
  const rates = GROUPS.map(g => {
    const series = GHZ[g], f = Math.min(FRAMES - 1, s * A.frames_per_step);
    return `${g} ${((series && series[f]) || 0).toFixed(0)} hertz`;
  }).join(", ");
  brain.setAttribute("aria-label",
    `${K.toLocaleString()} cell bodies of a male Drosophila nervous system at their measured `
    + `positions, seen from above: two optic lobes and the central brain, with the nerve cord `
    + `trailing away. Firing rates are ${rates}.`);
}

/* Hovering a pot explains it, so the questions do not have to be explained up front. */
const tip = document.createElement("div");
tip.className = "tip";
arena.parentElement.appendChild(tip);
const CHAN = {};
for (const c of B.channels) CHAN[c.key] = c;
function potAt(ev){
  const r = arena.getBoundingClientRect();
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const mx = (ev.clientX - r.left) * dpr, my = (ev.clientY - r.top) * dpr;
  const k = arenaScale(), ox = AW/2, oy = AH/2;
  for (const name of POTS){
    const b = A.bearings[name];
    const px = ox + A.ring*Math.cos(b)*k, py = oy - A.ring*Math.sin(b)*k;
    if (Math.hypot(mx - px, my - py) < 34*dpr) return name;
  }
  return null;
}
arena.addEventListener("mousemove", ev => {
  const name = potAt(ev);
  if (!name){ tip.classList.remove("on"); return; }
  const c = CHAN[name] || {};
  tip.innerHTML = `<b>${LABELS[name] || name}</b>`
    + `<span class="q">${c.question || ""}</span>`
    + `<div class="n">scored ${c.score >= 0 ? "+" : ""}${(c.score ?? 0).toFixed(2)}`
    + ` · confidence ${((c.confidence ?? 0)).toFixed(2)}`
    + ` · pull ${A.pots[name].toFixed(2)}</div>`;
  const r = arena.getBoundingClientRect();
  tip.style.left = Math.min(r.width - 280, ev.clientX - r.left + 14) + "px";
  tip.style.top = Math.max(8, ev.clientY - r.top - 10) + "px";
  tip.classList.add("on");
});
arena.addEventListener("mouseleave", () => tip.classList.remove("on"));

function layout(){ sizeArena(); sizeBrain(); drawArena(0, 0); drawBrain(0); describe(0); }
addEventListener("resize", () => { layers = null; layout(); });
layout();
say("press a button to send the fly in", false);
</script>
</body>
</html>
