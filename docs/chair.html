<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kärbes takes the chair</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F4EF;--panel:#FFFFFF;--ink:#1B1A18;--mute:#6E6A63;--rule:#E2DED5;--fly:#E2622C;--accent:#1B6B8C;--gold:#B8860B;
      --wall:#2C4BA0;--wood:#B07A3E;--wood2:#7A5330;--seat:#1A1B1F;
      --display:"Fraunces",Georgia,serif;--body:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
.stage{height:100%;display:grid;grid-template-rows:auto auto 1fr;gap:10px;padding:14px 18px 28px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.brand{font-family:var(--display);font-weight:600;font-size:22px}
.brand span{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-left:12px;font-weight:400}
.clock{font-family:var(--mono);font-size:13px;color:var(--mute)}.clock b{color:var(--ink);font-weight:500;font-size:18px}
.sel{font-family:var(--mono);font-size:11px;color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:4px 8px;margin-right:14px}
.board{display:grid;grid-template-columns:5fr 7fr;gap:12px;min-height:0}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:12px;position:relative;overflow:hidden;min-height:0}
canvas{display:block;width:100%;height:100%}
.tag{position:absolute;left:14px;top:11px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);z-index:2}
.item{position:absolute;left:14px;right:14px;top:30px;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:2}
.ticker{position:absolute;left:14px;right:14px;top:52px;z-index:2;display:flex;flex-direction:column;gap:3px;pointer-events:none}
.line{display:flex;gap:9px;align-items:baseline;font-size:13px;line-height:1.3;text-shadow:0 1px 0 rgba(255,255,255,.5);opacity:0;transform:translateY(4px);animation:in .25s forwards}
@keyframes in{to{opacity:1;transform:none}}
.line .chip{font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:4px;color:#fff;flex:none;letter-spacing:.04em}
.line .txt{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line.heckle .txt{color:#B8471A;font-style:italic}.line.chair .txt{color:var(--mute)}
.line.bell .txt{color:var(--gold);font-weight:600}
.coach{position:absolute;z-index:6;max-width:300px;background:rgba(27,26,24,.94);color:#F6F4EF;border-radius:8px;
  padding:10px 12px;font-size:12.5px;line-height:1.45;box-shadow:0 10px 30px -10px rgba(0,0,0,.45);opacity:0;transform:translateY(6px);
  transition:opacity .35s,transform .35s;pointer-events:none}
.coach.on{opacity:1;transform:none}.coach b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#B9B3A8;margin-bottom:3px}
.coach:after{content:"";position:absolute;left:18px;bottom:-7px;border:7px solid transparent;border-top-color:rgba(27,26,24,.94);border-bottom:0}
.bellmark{position:absolute;right:16px;top:14px;z-index:3;font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  color:var(--gold);opacity:0;transition:opacity .15s;text-transform:uppercase}
.bellmark.on{opacity:1}
.memo{position:absolute;left:14px;right:14px;bottom:36px;z-index:2;font-family:var(--mono);font-size:10.5px;color:var(--mute);line-height:1.55}
.memo .row{display:grid;grid-template-columns:150px 1fr 44px;line-height:1.35;gap:8px;align-items:center}
.memo .bar{height:6px;background:#ECE8E0;border-radius:2px;overflow:hidden}.memo .bar i{display:block;height:100%}
.memo b{color:var(--ink);font-weight:500;text-align:right}
.memo .two{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;margin-top:4px}
.regions{position:absolute;left:14px;bottom:12px;right:14px;display:flex;gap:14px;font-family:var(--mono);font-size:10px;color:var(--mute);z-index:2}
.regions i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:5px;vertical-align:middle}
.regions b{color:var(--ink);font-weight:500;margin-left:3px}
.nav{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.ctl{display:flex;gap:6px}.ctl button{font-family:var(--mono);font-size:11px;background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:6px 10px;cursor:pointer}
.ctl button.on{background:var(--ink);color:var(--bg)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden}.seg button{border:0;border-radius:0}
#timeline{height:44px;width:100%;display:block}
.legend{font-family:var(--mono);font-size:10px;color:var(--mute);line-height:1.5;text-align:right}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin:0 4px 0 8px;vertical-align:middle}
.veil{position:absolute;inset:0;background:rgba(246,244,239,.97);display:grid;place-items:center;z-index:9;transition:opacity .5s;overflow:auto}
.veil.gone{opacity:0;pointer-events:none}
.open{max-width:640px;text-align:center;padding:12px 24px}
.open h1{font-family:var(--display);font-weight:600;font-size:clamp(30px,5vw,48px);line-height:1.05;margin:0 0 14px}
.open p{color:#3E3A35;font-size:16px;margin:0 auto 10px;max-width:52ch}
.open .fine{font-size:12px;color:var(--mute)}
.go{margin-top:20px;font-size:15px;font-weight:600;color:var(--bg);background:var(--ink);border:0;border-radius:8px;padding:13px 24px;cursor:pointer}
.flyimg{width:84px;display:block;margin:0 auto 10px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.hallphoto{width:100%;max-width:440px;border-radius:8px;display:block;margin:0 auto 12px}
.end{position:absolute;inset:0;background:rgba(246,244,239,.98);display:none;place-items:center;z-index:8}
.end.on{display:grid}
.figs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0 6px}
.fig{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:10px}
.fig b{display:block;font-family:var(--mono);font-size:22px;font-weight:500}.fig span{font-size:11px;color:var(--mute)}
.credit{font-family:var(--mono);font-size:9.5px;color:#8E897F;margin-top:14px;line-height:1.5}
@media(max-width:900px){
  html,body{height:auto;overflow:auto}
  .stage{height:auto;min-height:100svh;padding:10px 10px 24px;gap:8px}
  .top{flex-wrap:wrap;gap:4px 12px}.brand{font-size:19px}.brand span{display:block;margin:2px 0 0}
  .clock{font-size:12px}.clock b{font-size:15px}.sel{margin-right:8px}
  .nav{grid-template-columns:1fr;grid-template-rows:auto auto auto;gap:8px}
  .ctl{flex-wrap:wrap}.ctl button{padding:7px 10px}
  #timeline{height:36px}.legend{text-align:left}
  .board{grid-template-columns:1fr;grid-template-rows:auto auto}
  #hallpanel{aspect-ratio:4/3;min-height:280px}
  #brainpanel{min-height:420px}
  .ticker{top:40px;gap:2px}.line{font-size:11px}.line:nth-child(-n+2){display:none}
  .item{display:none}.tag{font-size:9px}
  .coach{left:14px!important;right:14px!important;top:50px!important;max-width:none;font-size:11.5px}
  .memo{font-size:9.5px;bottom:56px}.memo .row{grid-template-columns:110px 1fr 36px}.memo .two{grid-template-columns:1fr}
  .regions{gap:4px 10px;flex-wrap:wrap;font-size:9px}
  .veil,.end{position:fixed}
  .open{padding:10px 14px}.open h1{font-size:26px}.open p{font-size:14px}
  .figs{grid-template-columns:1fr 1fr;gap:8px}.fig b{font-size:18px}
  .hallphoto{max-width:100%}
}
</style>
</head>

let BW=0, BH=0, plateBox=null, glowLayers=null;
function sizeBrain(){
  const panel = document.getElementById("brainpanel"), memo = document.getElementById("memo"), memoH = memo.offsetHeight, memoBottom = parseFloat(getComputedStyle(memo).bottom) || 36;
  if (MOBILE.matches){ const w = brain.getBoundingClientRect().width; panel.style.height = Math.round(44 + (w-24)/(D.brain.width/D.brain.height) + memoH + memoBottom + 78 + 8) + "px"; }
  else panel.style.height = "";
  const r = brain.getBoundingClientRect(); BW = Math.round(r.width*dpr); BH = Math.round(r.height*dpr);
  brain.width = BW; brain.height = BH;
  const ar = D.brain.width / D.brain.height;
  // the plate takes what is left above the motor bars, the tally and the region legend
  const reserve = (memoH + memoBottom + 78) * dpr;
  let w = BW - 24*dpr, h = w / ar; const maxH = BH - 44*dpr - reserve; if (h > maxH){ h = maxH; w = h * ar; }

  glowLayers = D.atlas.groups.map((g, gi) => {
    const c = document.createElement("canvas"); c.width = BW; c.height = BH; const x = c.getContext("2d");
    const [r_, g_, b_] = REGION[g] || [200,200,200]; const rad = 7*dpr; x.globalCompositeOperation = "lighter";
    for (let i=0;i<K;i++){ if (GRP[i]!==gi || !inside(i)) continue;
      const px = plateBox.x + XY[i*2]*plateBox.w, py = plateBox.y + XY[i*2+1]*plateBox.w;
      const gr = x.createRadialGradient(px,py,0,px,py,rad); gr.addColorStop(0,`rgba(${r_},${g_},${b_},.045)`); gr.addColorStop(1,`rgba(${r_},${g_},${b_},0)`);

const GROUPN = {}; for (let i=0;i<K;i++){ if (inside(i)){ const g = D.atlas.groups[GRP[i]]; GROUPN[g] = (GROUPN[g]||0)+1; } }
const MOTOR = {dna: Math.max(10, ...D.events.map(e => Math.max(e.dna_l||0, e.dna_r||0))), gf: Math.max(20, ...D.events.map(e => e.gf||0))};
let jolt = {x:0,y:0,t:0}, flash = 0;
/* 0 → 1 in 140 ms (ease-out), then back to 0 over 1.5 s (ease-in-out): the throw is a reflex, the return is a walk */
function joltK(now){ const a = now - jolt.t; if (a < 0 || !jolt.t) return 0; const OUT = 140, BACK = 1500;
  if (a < OUT){ const u = a/OUT; return 1 - Math.pow(1-u, 3); }

function drawBrain(f, alphaNext){

  bctx.globalCompositeOperation = "lighter";
  D.atlas.groups.forEach((g, gi) => {
    const a = D.group_hz[g][f] || 0, b = D.group_hz[g][Math.min(f+1,N-1)] || 0;
    const v = (a*(1-alphaNext) + b*alphaNext) / peak[g];
    bctx.globalAlpha = Math.min(0.85, 0.05 + 0.9*v*v + 0.25*v); bctx.drawImage(glowLayers[gi], 0, 0); });
  bctx.globalAlpha = 1;
  const ids = rasterAt(f);
  for (const i of ids){ if (!inside(i)) continue; const [r_,g_,b_] = REGION[D.atlas.groups[GRP[i]]] || [255,255,255];
    bctx.fillStyle = `rgba(${Math.min(255,r_+70)},${Math.min(255,g_+70)},${Math.min(255,b_+70)},.75)`;
    bctx.fillRect(plateBox.x + XY[i*2]*plateBox.w - 0.8*dpr, plateBox.y + XY[i*2+1]*plateBox.w - 0.8*dpr, 1.7*dpr, 1.7*dpr); }
  // the onset wave: the first 40 ms of this event, one 5 ms bin at a time, drawn as a bloom
  const we = (performance.now() - wave.t) / (WAVE_MS / speed);
  if (wave.k >= 0 && we < D.onset_bins){
    const b = Math.floor(we), fade = 1 - (we - b)*0.4, tally = {};
    for (let bb = Math.max(0, b-2); bb <= b; bb++){
      const age = b - bb, a = (age===0 ? 1 : age===1 ? 0.5 : 0.22) * fade, R = (age===0 ? 4.5 : 3)*dpr;
      for (const i of onsetAt(wave.k, bb)){ if (!inside(i)) continue;
        if (age===0) tally[D.atlas.groups[GRP[i]]] = (tally[D.atlas.groups[GRP[i]]]||0)+1;
        const px = plateBox.x + XY[i*2]*plateBox.w, py = plateBox.y + XY[i*2+1]*plateBox.w;
        const gr = bctx.createRadialGradient(px,py,0,px,py,R); gr.addColorStop(0,`rgba(255,250,225,${a})`); gr.addColorStop(0.35,`rgba(255,215,140,${a*0.6})`); gr.addColorStop(1,"rgba(255,200,120,0)");
        bctx.fillStyle = gr; bctx.fillRect(px-R,py-R,R*2,R*2);
        bctx.fillStyle = `rgba(255,255,255,${a})`; bctx.fillRect(px-0.9*dpr, py-0.9*dpr, 1.8*dpr, 1.8*dpr); } }
    const lead = Object.entries(tally).map(([g,n]) => [g, n / Math.max(1, GROUPN[g]||1), n]).sort((x,y)=>y[1]-x[1])[0];
    const where = lead ? (t("where")[lead[0]] || lead[0]) : "";
    bctx.fillStyle = "rgba(7,9,14,.72)"; bctx.fillRect(plateBox.x + 10*dpr, plateBox.y + 10*dpr, 330*dpr, 22*dpr);
    bctx.fillStyle = "#E9EEF6"; bctx.font = `500 ${11*dpr}px "IBM Plex Mono",monospace`; bctx.textAlign = "left";
    bctx.fillText(t("onset")((Math.min(we, D.onset_bins)*5).toFixed(0).padStart(2), where, Math.round(WAVE_MS/5/speed)), plateBox.x + 16*dpr, plateBox.y + 25*dpr); }

    const y0 = plateBox.y + plateBox.h + 18*dpr, x0 = plateBox.x + 110*dpr, W = plateBox.w - 130*dpr;
    bctx.font = `${10*dpr}px "IBM Plex Mono",monospace`; bctx.textAlign = "right";
    [[t("steerL"), ev.dna_l ?? 0, MOTOR.dna, "#1B6B8C"], [t("steerR"), ev.dna_r ?? 0, MOTOR.dna, "#1B6B8C"], [t("escape"), ev.gf, MOTOR.gf, ev.gf>=D.bell_gf ? "#D9A21B" : "#B9B3A8"]].forEach(([lab, v, mx, col], i) => {
      const y = y0 + i*15*dpr; bctx.fillStyle = "#6E6A63"; bctx.fillText(lab, x0 - 10*dpr, y + 8*dpr);
      bctx.fillStyle = "#ECE8E0"; bctx.fillRect(x0, y, W, 9*dpr); bctx.fillStyle = col; bctx.fillRect(x0, y, W*Math.min(1, v/mx), 9*dpr);
      bctx.fillStyle = "#1B1A18"; bctx.textAlign = "left"; bctx.fillText(String(v), x0 + W*Math.min(1, v/mx) + 6*dpr, y + 8*dpr); bctx.textAlign = "right"; });
    bctx.textAlign = "left"; }
  if (flash > 0){ bctx.strokeStyle = `rgba(255,220,130,${Math.min(1,flash)})`; bctx.lineWidth = 6*dpr*Math.min(1,flash); bctx.strokeRect(plateBox.x-3*dpr, plateBox.y-3*dpr, plateBox.w+6*dpr, plateBox.h+6*dpr);
    bctx.fillStyle = `rgba(255,230,170,${0.10*Math.min(1,flash)})`; bctx.fillRect(plateBox.x, plateBox.y, plateBox.w, plateBox.h); flash *= 0.90; if (flash<0.02) flash=0; }
}

/* Where the chairs are in the photograph (Paul Kuimet, from the Speaker's desk), as fractions
   of its width and height: one quadrilateral per block, near edge first. Read off the image by
   eye; the lights land on chairs, not on a diagram. The photograph itself is not modified —
   everything below is drawn on the canvas above it. */
const PHOTO = {w: 1024, h: 682,
  L: {nl:[0.01,0.70], nr:[0.485,0.70], fr:[0.468,0.50], fl:[0.30,0.50]},   // near-left, near-right, far-right, far-left
  R: {nl:[0.53,0.70], nr:[0.995,0.70], fr:[0.705,0.50], fl:[0.548,0.50]},
  bell:[0.722,0.515], desk:[0.5,0.90], aisleTop:[0.505,0.44]};
let HW=0, HH=0, seatPos = {};
const rows = Math.max(...D.seats.map(s=>s.row))+1, cols = Math.max(...D.seats.map(s=>s.col))+1;
let photoBox = {x:0,y:0,w:0,h:0};
function lerp(a,b,t){ return a + (b-a)*t; }
function quadPoint(q, u, v){ // u across the block (0 = outer edge... we use 0 = left), v depth (0 = near row)
  const lx = lerp(q.nl[0], q.fl[0], v), ly = lerp(q.nl[1], q.fl[1], v);
  const rx = lerp(q.nr[0], q.fr[0], v), ry = lerp(q.nr[1], q.fr[1], v);
  return [lerp(lx, rx, u), lerp(ly, ry, u)];
}
function sizeHall(){
  const r = hall.getBoundingClientRect(); HW = Math.round(r.width*dpr); HH = Math.round(r.height*dpr); hall.width = HW; hall.height = HH;
  // the photograph fills the width; the remaining height is wall above and desk below
  // cover the panel below the ticker: the desk sits at the bottom edge, the sides crop symmetrically
  const top = 52*dpr*0 + HH*0.0, avail = HH; let ph = avail, pw = ph * PHOTO.w / PHOTO.h;
  if (pw < HW){ pw = HW; ph = pw * PHOTO.h / PHOTO.w; }
  photoBox = {x: (HW - pw)/2, y: HH - ph, w: pw, h: ph};
  seatPos = {};
  const byside = {L: D.seats.filter(s=>s.side==="L"), R: D.seats.filter(s=>s.side==="R")};
  for (const side of ["L","R"]){
    const seats = byside[side].slice().sort((a,b)=>a.place-b.place), q = PHOTO[side];
    const perRow = Math.ceil(seats.length / rows);
    seats.forEach((s, i) => {
      const row = Math.floor(i / perRow), col = i % perRow, n = Math.min(perRow, seats.length - row*perRow);
      // depth: rows spaced with perspective so far rows sit closer together, as in the image
      const v = Math.pow(row / Math.max(1, rows-1), 0.78), u = (col + 0.5) / n;
      const [fx, fy] = quadPoint(q, side==="L" ? u : u, v);
      const scale = 1 - 0.55*v;
      seatPos[s.place] = {x: photoBox.x + fx*photoBox.w, y: photoBox.y + fy*photoBox.h, w: photoBox.w*0.028*scale, h: photoBox.h*0.05*scale, scale};
    });
  }
}
let lit = {};
function drawHall(){
  if (!HW) sizeHall();
  hctx.clearRect(0,0,HW,HH);
  hctx.fillStyle = "#26439C"; hctx.fillRect(0,0,HW,HH);
  const now = performance.now(), k = joltK(now);
  hctx.save(); hctx.translate(jolt.x*k*dpr*0.5, 0);                                      // the view shakes with the fly
  if (HALLPHOTO.complete) hctx.drawImage(HALLPHOTO, photoBox.x, photoBox.y, photoBox.w, photoBox.h);
  // a frost over the ceiling so the transcript reads on it
  const frost = hctx.createLinearGradient(0, 0, 0, HH); frost.addColorStop(0,"rgba(246,244,239,.96)"); frost.addColorStop(0.2,"rgba(246,244,239,.80)"); frost.addColorStop(0.3,"rgba(246,244,239,.30)"); frost.addColorStop(0.4,"rgba(246,244,239,0)");
  hctx.fillStyle = frost; hctx.fillRect(0, 0, HW, HH);
  // the seats: nothing at rest — the chairs are in the photograph — and a lamp on whoever is speaking
  hctx.globalCompositeOperation = "lighter";
  for (const s of D.seats){
    const p = seatPos[s.place]; if (!p) continue;
    const l = lit[s.place]; if (!l) continue;
    const speaking = D.events[curEv] && D.events[curEv].seat === s.place && D.events[curEv].kind === "speech" && playing;
    const a = speaking ? 1 : Math.max(0, 1-(now-(l.off||l.t))/(l.kind==="heckle"?900:1400));
    if (speaking) l.off = now;
    if (a <= 0.01) continue;
    const many = l.kind==="vote" || l.kind==="presence";
    const R = p.w*(many ? 1.3 : 4.2), ga = many ? 0.3*a : a; const gr = hctx.createRadialGradient(p.x,p.y,0,p.x,p.y,R);
    const col = l.kind==="heckle" ? "255,110,50" : hexrgb(s.colour);
    gr.addColorStop(0,`rgba(${col},${1*ga})`); gr.addColorStop(0.22,`rgba(${col},${.7*ga})`); gr.addColorStop(0.5,`rgba(${col},${.25*ga})`); gr.addColorStop(1,`rgba(${col},0)`);
    hctx.fillStyle = gr; hctx.fillRect(p.x-R,p.y-R,R*2,R*2);
    hctx.globalCompositeOperation = "source-over";
    if (many){ hctx.fillStyle = `rgba(${col},${.7*a})`; hctx.beginPath(); hctx.arc(p.x,p.y,p.w*0.3,0,6.2832); hctx.fill(); hctx.globalCompositeOperation = "lighter"; continue; }
    hctx.fillStyle = `rgba(${col},${.95*a})`; hctx.beginPath(); hctx.arc(p.x,p.y,p.w*0.42,0,6.2832); hctx.fill();
    hctx.fillStyle = `rgba(255,255,255,${.95*a})`; hctx.beginPath(); hctx.arc(p.x,p.y,p.w*0.22,0,6.2832); hctx.fill();
    hctx.globalCompositeOperation = "lighter";
    hctx.strokeStyle = `rgba(${col},${.9*a})`; hctx.lineWidth = 2*dpr; hctx.beginPath(); hctx.arc(p.x,p.y,p.w*0.7,0,6.2832); hctx.stroke();
  }
  hctx.globalCompositeOperation = "source-over";
  // the bell that is actually on the desk in the photograph glows when the fly rings
  if (flash > 0){ const [bx,by] = PHOTO.bell; const cx = photoBox.x+bx*photoBox.w, cy = photoBox.y+by*photoBox.h, R = photoBox.w*0.05;
    const gr = hctx.createRadialGradient(cx,cy,0,cx,cy,R); gr.addColorStop(0,`rgba(255,220,120,${.9*flash})`); gr.addColorStop(1,"rgba(255,200,80,0)"); hctx.fillStyle = gr; hctx.fillRect(cx-R,cy-R,R*2,R*2); }
  hctx.restore();
  // the fly on the Speaker's desk, thrown by the escape
  if (FLY.complete && FLY.naturalWidth){ const fw = HW*0.14, fh = fw*FLY.naturalHeight/FLY.naturalWidth; const [dx,dy] = PHOTO.desk;
    hctx.save(); hctx.translate(photoBox.x+dx*photoBox.w + jolt.x*k*dpr*3.2, photoBox.y+dy*photoBox.h + jolt.y*k*dpr*1.5); hctx.rotate(-jolt.x*k*0.06);
    // it stands on the desk: a tight contact shadow under the body and a wider, fainter one around it
    hctx.shadowColor="rgba(0,0,0,.28)"; hctx.shadowBlur=22*dpr; hctx.shadowOffsetY=10*dpr; hctx.drawImage(FLY, -fw/2, -fh/2, fw, fh);
    hctx.shadowColor="rgba(0,0,0,.35)"; hctx.shadowBlur=5*dpr; hctx.shadowOffsetY=3*dpr; hctx.drawImage(FLY, -fw/2, -fh/2, fw, fh); hctx.restore(); }
}
function hexrgb(hex){ const n = parseInt(hex.slice(1),16); return `${n>>16},${(n>>8)&255},${n&255}`; }
function hexa(hex, a){ const n = parseInt(hex.slice(1),16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; }
function mix(h1, h2, t){ const a = parseInt(h1.slice(1),16), b = parseInt(h2.slice(1),16); const c = [16,8,0].map(sh => Math.round(((a>>sh)&255)*t + ((b>>sh)&255)*(1-t))); return `rgb(${c.join(",")})`; }
function roundRect(x,y,w,h,r){ hctx.beginPath(); hctx.moveTo(x+r,y); hctx.arcTo(x+w,y,x+w,y+h,r); hctx.arcTo(x+w,y+h,x,y+h,r); hctx.arcTo(x,y+h,x,y,r); hctx.arcTo(x,y,x+w,y,r); hctx.closePath(); }

/* ---------- playback ---------- */
const ticker = document.getElementById("ticker"), itemEl = document.getElementById("item"), timeEl = document.getElementById("time");
const bellmark = document.getElementById("bellmark");


let frame = 0, speed = 4, lastEv = -1, lastT = 0, acc = 0;
const t0 = new Date(D.start).getTime();
function clock(ev){ if (!ev) return; const d = new Date(t0 + ev.t*1000); const day = Math.floor((ev.t + new Date(t0).getUTCHours()*3600 + 3*3600) / 86400); timeEl.textContent = d.toLocaleTimeString("et-EE",{hour:"2-digit",minute:"2-digit",timeZone:"Europe/Tallinn"}) + (day >= 1 ? " +" + day + t("dayMark") : ""); }
function who(ev){ return lang === "et" ? (ev.who_et || ev.who) : ev.who; }
function line(ev, cls){
  const el = document.createElement("div"); el.className = "line " + cls; const C = t("chip");
  const chipText = ev.kind==="heckle" ? C.heckle : ev.kind==="vote" ? C.vote : ev.kind==="presence" ? C.presence : ev.role==="chair" ? C.chair : ev.role==="gov" ? C.gov : (ev.faction === "I" ? "ISAMAA" : ev.faction || C.nonaff).toUpperCase();
  const chip = `<span class="chip" style="background:${ev.kind==="heckle"?"#C24B18":(COLOUR[ev.faction]||"#6E6A63")}">${chipText}</span>`;
  const txt = ev.kind==="vote" ? t("halls_votes") : ev.kind==="presence" ? t("presence_check") : ev.text || who(ev);
  el.innerHTML = chip + `<span class="txt">${ev.kind==="speech" && ev.role!=="chair" ? who(ev)+": " : ""}${txt}</span>`;
  ticker.appendChild(el); while (ticker.children.length > 5) ticker.removeChild(ticker.firstChild);
}
function onEvent(i){
  const ev = D.events[i]; if (!ev) return;
  clock(ev); itemEl.textContent = ev.item;
  // the real chair's marks live on chair events, which carry no frames: surface them first
  for (let j = lastEv+1; j < i; j++){ const c = D.events[j]; if (c && c.role==="chair"){ if (c.real_chair) line({...c, text: c.real_chair==="bell" ? t("ringsBell") : c.real_chair==="order" ? t("callsOrder")+c.text : t("callsTime")+c.text}, "chair"); else if (c.text) line(c, "chair"); } }
  line(ev, ev.kind);
  if (ev.seat) lit[ev.seat] = {t: performance.now(), kind: ev.kind};
  if (ev.role === "gov") lit.__gov = {t: performance.now()};
  if (ev.kind==="vote" || ev.kind==="presence") for (const s of D.seats) lit[s.place] = {t: performance.now(), kind: "vote"};
  if (ev.gf >= D.bell_gf){ ding(); coach("bell"); flash = 1; jolt = {x: ev.side==="L" ? 34 : ev.side==="R" ? -34 : 0, y: -18, t: performance.now()}; bellmark.classList.add("on"); setTimeout(()=>bellmark.classList.remove("on"), 1400);
    const b = document.createElement("div"); b.className="line bell"; b.innerHTML = `<span class="chip" style="background:#B8902E">${t("chip").fly}</span><span class="txt">${t("bellLine")(ev.gf_first_ms!=null ? ev.gf_first_ms.toFixed(0) : null, ev.side)}</span>`; ticker.appendChild(b); while (ticker.children.length > 5) ticker.removeChild(ticker.firstChild); }
  remember(i);
  lastEv = i;
}
/* ---------- memory: the tally the brain cannot keep ---------- */
const M = {kinds:{}, bellsBySide:{L:0,R:0,"":0}, thrown:{left:0,right:0}, ritual:0, seen:{}, repeatBells:0, chair:{order:0,bell:0,time:0}, flyBells:0, coincide:0, lastBellIdx:-99, rt:[]};
function remember(i){
  const ev = D.events[i]; if (!ev) return;
  // the real chair's marks since the last stimulus, checked against the PREVIOUS bell before
  // this event's own bell is registered — the chair reacts after the offence, not before it
  for (let j = lastEv+1; j <= i; j++){ const c = D.events[j]; if (c && c.real_chair){ M.chair[c.real_chair]++; const d = j - M.lastBellIdx; if (c.real_chair!=="time" && M.lastBellIdx>=0 && d >= 0 && d <= 2) M.coincide++; } }
  const kind = ev.kind==="speech" ? (ev.hostility>=0.5 ? "hostile speech" : "civil speech") : ev.kind;
  const k = M.kinds[kind] = M.kinds[kind] || {n:0, gf:0, bells:0, active:0};
  k.n++; k.gf += ev.gf||0; k.active += ev.active||0;
  if (ev.text && /^(Aitäh|Suur tänu|Tänan)/.test(ev.text) && ev.role!=="chair") M.ritual++;
  if (ev.gf >= D.bell_gf){ k.bells++; M.flyBells++; M.bellsBySide[ev.side||""]++; M.lastBellIdx = i; if (ev.gf_first_ms!=null) M.rt.push(ev.gf_first_ms);
    if (ev.turn > 0.15) M.thrown.right++; else if (ev.turn < -0.15) M.thrown.left++;
    const key = ev.seat || ev.who; if (M.seen[key]) M.repeatBells++; M.seen[key] = (M.seen[key]||0)+1; }
  renderMemo();
}
function renderMemo(){
  const order = ["civil speech","hostile speech","heckle","vote","presence"], mx = Math.max(1, ...order.map(k => (M.kinds[k]||{}).n ? M.kinds[k].gf/M.kinds[k].n : 0));
  let h = order.filter(k => M.kinds[k]).map(k => { const v = M.kinds[k], g = v.gf/v.n; return `<div class="row"><span>${t("kinds")[k]||k} ×${v.n}</span><span class="bar"><i style="width:${100*g/mx}%;background:${g>=D.bell_gf?"#FFD36E":"#3A4658"}"></i></span><b>${g.toFixed(0)}</b></div>`; }).join("");
  const rt = M.rt.length ? t("memoRT")((M.rt.reduce((a,b)=>a+b,0)/M.rt.length).toFixed(0)) : "";
  h += `<div class="two"><span>${t("memoGF")}</span><span></span>`
     + `<span>${t("memoBells")(M.flyBells, M.thrown.left, M.thrown.right, rt)}</span>`
     + `<span>${t("memoChair")(M.chair.order, M.chair.bell, M.chair.time, M.coincide)}</span>`
     + `<span>${t("memoRepeat")(M.repeatBells)}</span>`
     + `<span>${t("memoRitual")(M.ritual)}</span></div>`;
  document.getElementById("memobody").innerHTML = h;
  const mh = document.getElementById("memo").offsetHeight; if (mh !== memoH){ memoH = mh; if (plateBox) sizeBrain(); }
}
let memoH = 0;

/* ---------- one-time captions ---------- */
const coached = {};
function coach(what){ if (coached[what]) return; coached[what] = true; const el = document.getElementById("coach-"+what); if (!el) return;
  setTimeout(() => { el.classList.add("on"); setTimeout(() => el.classList.remove("on"), what==="wave" ? 5200 : 6500); }, what==="wave" ? 900 : 150); }

/* ---------- sound ---------- */
let AC = null;
function ding(){ if (muted) return; try { AC = AC || new (window.AudioContext||window.webkitAudioContext)(); const t = AC.currentTime;
  for (const [f, g, d] of [[2093, .22, .45], [3520, .10, .30], [1046, .06, .6]]){ const o = AC.createOscillator(), v = AC.createGain(); o.frequency.value = f; o.type = "sine";
    v.gain.setValueAtTime(0.0001, t); v.gain.exponentialRampToValueAtTime(g, t+0.004); v.gain.exponentialRampToValueAtTime(0.0001, t+d);
    o.connect(v); v.connect(AC.destination); o.start(t); o.stop(t+d+0.05); } } catch(e){} }

/* silence frames belong to no event; when the event index changes to a new stimulus, fire it */
let curEv = -1;
function step(ts){
  if (playing){ acc += (ts - lastT)/1000 * FPS * speed; while (acc >= 1){ frame++; acc -= 1; } if (frame >= N){ frame = N-1; playing = false; finish(); } }
  lastT = ts;
  const evi = D.frame_event[frame];
  if (evi >= 0 && evi !== curEv){ curEv = evi; onEvent(evi); if (onsetOf[evi] !== undefined){ wave = {t: performance.now(), k: onsetOf[evi]}; coach("wave"); } }
  drawBrain(frame, acc);
  drawHall();
  for (const g of D.atlas.groups){ const el = document.getElementById("hz-"+g); if (el) el.textContent = (D.group_hz[g][frame]||0).toFixed(1); }
  drawTimeline();
  requestAnimationFrame(step);
}

/* ---------- timeline ---------- */
const tl = document.getElementById("timeline"), tctx = tl.getContext("2d");
const evFrame = {}; D.frame_event.forEach((e,f)=>{ if (e>=0 && evFrame[e]===undefined) evFrame[e]=f; });
function drawTimeline(){
  const r = tl.getBoundingClientRect(); const W = Math.round(r.width*dpr), H = Math.round(r.height*dpr);
  if (tl.width!==W){ tl.width=W; tl.height=H; }
  tctx.clearRect(0,0,W,H); tctx.fillStyle="#FFFFFF"; tctx.fillRect(0,0,W,H);
  const x = f => (f/N)*W;
  // real chair marks below the line, fly bells above
  let after = 0;
  D.events.forEach((e,i)=>{ if (e.real_chair){ const f = evFrame[i] ?? nextFrame(i); tctx.fillStyle = e.real_chair==="time" ? "#C9C3B8" : "#1B6B8C"; tctx.fillRect(x(f), H*0.55, Math.max(1.5*dpr,1), H*0.35); }
    if (e.gf >= D.bell_gf){ tctx.fillStyle = "#D9A21B"; tctx.fillRect(x(evFrame[i]), H*0.12, Math.max(1.5*dpr,1), H*0.35); } });
  tctx.fillStyle="#1B1A18"; tctx.fillRect(x(frame)-dpr, 0, 2*dpr, H);
}
function nextFrame(i){ for (let j=i;j<D.events.length;j++) if (evFrame[j]!==undefined) return evFrame[j]; return N-1; }
tl.addEventListener("click", e => { const r = tl.getBoundingClientRect(); frame = Math.floor((e.clientX-r.left)/r.width*N); curEv=-1; ticker.innerHTML=""; resetMemory();
  // replay memory silently up to here, so the tally is what a viewer who watched from the start would have
  const target = D.frame_event.slice(0, frame).filter(x => x>=0).pop() ?? -1; lastEv = -1;
  for (let i = 0; i <= target; i++){ if (D.events[i].bio > 0){ const keep = renderMemo; remember(i); lastEv = i; } } });

/* ---------- controls ---------- */
const playBtn = document.getElementById("play");
function setPlay(p){ playing = p; playBtn.textContent = p ? t("pause") : t("play"); }
playBtn.onclick = () => setPlay(!playing);
document.getElementById("mute").onclick = () => { muted = !muted; document.getElementById("mute").textContent = muted ? t("muted") : t("sound"); };
for (const [id, s] of [["sp1",1],["sp4",4],["sp12",12]]) document.getElementById(id).onclick = () => { speed = s; for (const b of ["sp1","sp4","sp12"]) document.getElementById(b).classList.toggle("on", b===id); };
document.getElementById("start").onclick = () => { document.getElementById("veil").classList.add("gone"); sizeHall(); sizeBrain(); setPlay(true); };
function resetMemory(){ for (const k of Object.keys(M.kinds)) delete M.kinds[k]; M.rt=[]; M.bellsBySide={L:0,R:0,"":0}; M.thrown={left:0,right:0}; M.ritual=0; M.seen={}; M.repeatBells=0; M.chair={order:0,bell:0,time:0}; M.flyBells=0; M.coincide=0; M.lastBellIdx=-99; renderMemo(); }
document.getElementById("again").onclick = () => { document.getElementById("end").classList.remove("on"); frame=0; curEv=-1; lastEv=-1; ticker.innerHTML=""; lit={}; resetMemory(); setPlay(true); };
addEventListener("resize", () => { sizeHall(); sizeBrain(); });
function finish(){
  const S = D.summary, K = S.by_kind || {}, kinds = ["civil speech","hostile speech","heckle","vote"].filter(k => K[k]);
  document.getElementById("figs").innerHTML = t("figs")(S).map(([n,tx])=>`<div class="fig"><b>${n}</b><span>${tx}</span></div>`).join("") + kinds.map(k => `<div class="fig">${t("figKind")(k, K[k])}</div>`).join("");
  const fmt = ms => new Date(ms).toLocaleTimeString("et-EE",{hour:"2-digit",minute:"2-digit",timeZone:"Europe/Tallinn"});
  const last = D.events[D.events.length-1].t, day = last >= 86400 ? t("twoDays") : last >= 30000 ? t("nextDay") : "";
  let v = t("verdict")(S, Math.round(last/60), fmt(t0), fmt(t0 + last*1000), day);
  const old = document.querySelector("#end .go + .go"); if (old) old.remove();
  if (D.others && D.others.length){ const o = D.others[0]; v += t("compare")(o);
    const a = document.createElement("a"); a.href = o.url; a.className = "go"; a.style.cssText = "display:inline-block;margin-left:10px;text-decoration:none;background:var(--panel);color:var(--ink);border:1px solid var(--rule)"; a.textContent = t("watch") + " " + (lang==="et" ? o.date_et : o.date); document.getElementById("again").after(a); }
  document.getElementById("verdict").textContent = v;
  document.getElementById("credit").innerHTML = t("credit");
  document.getElementById("end").classList.add("on");
}
booted = true;
applyLang();
requestAnimationFrame(step);
</script>
</body>
