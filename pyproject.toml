[project]
name = "karbes"
version = "0.1.0"
description = "Kärbes — a MaleCNS connectome simulation cast as the 102nd member of the Riigikogu"
license = "CC-BY-4.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",      # Riigikogu fetcher (rate-limited, resumable)
    "numpy>=1.26",
    "scipy>=1.11",      # sparse connectome matrices, stats
    "pandas>=2.2",
    "pyarrow>=16",      # MaleCNS .feather
    "scikit-learn>=1.5",# baselines, logistic controls, PCA
    "matplotlib>=3.8",
]

[project.optional-dependencies]
score = ["openai>=1.40"]   # OpenRouter via the OpenAI SDK (Stage 1+)
dev   = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
karbes = "karbes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["karbes"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
